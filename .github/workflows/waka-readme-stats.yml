name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 00:00AM UTC (France is UTC + 2)
    - cron: '0 0 * * *'
    
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit identity
        env:
          COMMIT_USERNAME: ${{ vars.COMMIT_USERNAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_USERNAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo "COMMIT_USERNAME and COMMIT_EMAIL repository variables are required."
            exit 1
          fi

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMIT_USERNAME: ${{ vars.COMMIT_USERNAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
          SHOW_LINES_OF_CODE: "True"
          SHOW_LOC_CHART: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_PROJECTS: "False"
